<text x="180" y="65" font-family="Arial, sans-serif" font-size="3.5" fill="#263238">Altura do fechamento = PD efetivo - topo da caixa R53</text>
<text x="180" y="75" font-family="Arial, sans-serif" font-size="3.5" fill="#94621c">Resultado: 160 N</text>
<text x="180" y="92" font-family="Arial, sans-serif" font-size="3" fill="#263238">Envelope de estudo; espessura, juntas e acesso de montagem com oficina/RT.</text>
<text x="180" y="103" font-family="Arial, sans-serif" font-size="3" fill="#263238">Não representa nova peça incorporada ao FCStd.</text>
<text x="180" y="114" font-family="Arial, sans-serif" font-size="3" fill="#263238">Não reduzir automaticamente peças existentes para ocultar conflito.</text>
<text x="180" y="125" font-family="Arial, sans-serif" font-size="3" fill="#263238">P03 e aéreos: altura de estudo = PD - folga nominal - base R53.</text>
<text x="180" y="136" font-family="Arial, sans-serif" font-size="3" fill="#263238">Conferir teto em vários pontos; usar altura livre limitante no CSV.</text>
