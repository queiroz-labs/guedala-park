name: Publicar estudo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Segunda linha de defesa: roda mesmo que alguém tenha pulado o hook local (--no-verify).
      - name: Verificar estrutura, modelo, links, tamanho e privacidade
        run: python3 -B ferramentas/verificar_tudo.py --ci
      - name: Afirmações sem fonte nos commits deste push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          if git fetch --no-tags --depth=1 origin "${{ github.event.before }}"; then
            python3 -B ferramentas/verificar_afirmacoes.py --desde "${{ github.event.before }}"
          else
            echo "Commit anterior indisponível (push forçado?); afirmações não conferidas."
          fi
      - name: Instalar ferramenta de build
        run: npm ci --prefix ferramentas/site --ignore-scripts
      - name: Conferir orientação e aberturas
        run: |
          node ferramentas/site/test_orientation.cjs
          node ferramentas/site/test_scene_revision.cjs
          node ferramentas/site/test_lighting.cjs
      - name: Preparar HTML e moodboard
        run: python3 -B ferramentas/site/preparar_pages.py --output-dir "$RUNNER_TEMP/guedala-pages" --publication-ready --package-mode auto
      - name: Conferir revisão e selagem do pacote
        env:
          GUEDALA_TEST_ROOT: ${{ runner.temp }}/guedala-testes
        run: python3 -B ferramentas/site/test_current_release.py
      - name: Conferir agrupamento de peças
        run: |
          python3 ferramentas/site/test_part_groups.py
          node ferramentas/site/test_part_groups_ui.cjs
      - name: Conferir interiores em corte
        run: node ferramentas/site/test_storage.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/guedala-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
