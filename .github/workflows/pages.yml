name: Publicar estudo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Instalar ferramenta de build
        run: npm ci --prefix 01_Projeto/Estudo_interativo --ignore-scripts
      - name: Conferir orientação e aberturas
        run: |
          node 01_Projeto/Estudo_interativo/test_orientation.cjs
          node 01_Projeto/Estudo_interativo/test_scene_revision.cjs
          node 01_Projeto/Estudo_interativo/test_lighting.cjs
      - name: Preparar HTML e moodboard
        run: python3 -B 01_Projeto/Estudo_interativo/preparar_pages.py --output-dir "$RUNNER_TEMP/guedala-pages" --publication-ready --package-mode auto
      - name: Conferir revisão e selagem do pacote
        env:
          GUEDALA_TEST_ROOT: ${{ runner.temp }}/guedala-testes
        run: python3 -B 01_Projeto/Estudo_interativo/test_current_release.py
      - name: Conferir agrupamento de peças
        run: |
          python3 01_Projeto/Estudo_interativo/test_part_groups.py
          node 01_Projeto/Estudo_interativo/test_part_groups_ui.cjs
      - name: Conferir interiores em corte
        run: node 01_Projeto/Estudo_interativo/test_storage.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/guedala-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
