<div id="gaveta-cabos-fixos-r02">
  <h3>Vassoura e rodo na gaveta</h3>
  <div class="text-small">Vista de cima · envelopes de estudo · cabeças retiradas</div>
  <div class="drawer-plan" role="img" aria-label="Gaveta de estudo com 118,7 centímetros de comprimento, 40,6 de profundidade e 8,8 de altura útil. Dois cabos fixos de 112,5 centímetros ficam paralelos; as cabeças de vassoura e rodo ficam separadas, sem empilhar."></div>
  <div class="viz-row text-small"><span>Cabos fixos: 112,5 cm</span><span>Altura útil de estudo: 8,8 cm</span></div>
</div>
<style>
  #gaveta-cabos-fixos-r02 .drawer-plan { width:100%; }
  #gaveta-cabos-fixos-r02 svg { display:block; width:100%; overflow:visible; }
  #gaveta-cabos-fixos-r02 .outline { fill:var(--background); stroke:var(--border); stroke-width:1.5; }
  #gaveta-cabos-fixos-r02 .dim { stroke:var(--muted-foreground); stroke-width:1; fill:none; }
  #gaveta-cabos-fixos-r02 .handle { fill:var(--viz-series-1); }
  #gaveta-cabos-fixos-r02 .head { fill:var(--viz-series-2); fill-opacity:.17; }
  #gaveta-cabos-fixos-r02 text { fill:var(--foreground); font:inherit; }
</style>
<script>
(() => {
  const root = document.getElementById('gaveta-cabos-fixos-r02');
  const host = root.querySelector('.drawer-plan');
  const ns = 'http://www.w3.org/2000/svg';
  function draw() {
    const w = Math.max(280, host.clientWidth);
    const x0 = 48, y0 = 43, scale = (w - 62) / 118.7;
    const depth = 40.6 * scale, length = 118.7 * scale;
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${w} ${depth + 68}`);
    svg.setAttribute('height', depth + 68);
    svg.setAttribute('aria-hidden', 'true');
    function el(tag, attrs, value) {
      const e = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
      if (value !== undefined) e.textContent = value;
      svg.appendChild(e); return e;
    }
    function rect(x,y,a,b,cls) { el('rect',{x:x0+x*scale,y:y0+y*scale,width:a*scale,height:b*scale,class:cls}); }
    function txt(x,y,s,anchor='middle') { el('text',{x,y,'text-anchor':anchor,class:'text-small'},s); }
    rect(0,0,118.7,40.6,'outline');
    rect(3.1,3,112.5,2.1,'handle');
    rect(3.1,6.5,112.5,2.1,'handle');
    rect(5,14,31.5,19,'head');
    rect(43,17,32.5,9.5,'head');
    txt(x0+20.75*scale,y0+23.5*scale+4,'Vassoura');
    txt(x0+59.25*scale,y0+21.75*scale+4,'Rodo');
    el('path',{d:`M ${x0} 27 H ${x0+length} M ${x0} 23 V 31 M ${x0+length} 23 V 31`,class:'dim'});
    txt(x0+length/2,18,'118,7 cm');
    el('path',{d:`M 35 ${y0} V ${y0+depth} M 31 ${y0} H 39 M 31 ${y0+depth} H 39`,class:'dim'});
    el('text',{x:0,y:0,transform:`translate(20 ${y0+depth/2}) rotate(-90)`,'text-anchor':'middle',class:'text-small'},'40,6 cm');
    host.replaceChildren(svg);
  }
  new ResizeObserver(draw).observe(host);
  draw();
})();
</script>
