<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
<title id="title">P11 — hipóteses de apoio da prateleira</title>
<desc id="desc">Viga de vão661mm com apoios simples ideais nas laterais. Em planta, quatro Minifix nominais a60 e252mm da frente. O contato traseiro não é contado como apoio.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#293b49"/></marker></defs>
<rect width="1080" height="680" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#253747">
<text x="50" y="43" font-size="25" font-weight="bold">P11 · prateleira de 661 × 312 × 18 mm</text>
<text x="50" y="72" font-size="15">Esquema de cálculo R00 · dimensões em mm · sem escala de fabricação</text>
<text x="50" y="113" font-size="18" font-weight="bold">Modelo global no vão</text>
<rect x="120" y="186" width="740" height="20" fill="#dbe5e8" stroke="#293b49" stroke-width="2"/>
<path d="M120 208l-15 23h30z M860 208l-15 23h30z" fill="#dbe5e8" stroke="#293b49"/>
<path d="M97 239h46 M837 239h46" stroke="#293b49"/>
<circle cx="851" cy="235" r="3" fill="#293b49"/><circle cx="869" cy="235" r="3" fill="#293b49"/>
<g stroke="#293b49" stroke-width="1.8" marker-end="url(#arrow)"><path d="M155 142v37"/><path d="M245 142v37"/><path d="M335 142v37"/><path d="M425 142v37"/><path d="M515 142v37"/><path d="M605 142v37"/><path d="M695 142v37"/><path d="M785 142v37"/></g>
<text x="490" y="132" text-anchor="middle" font-size="15">Peso próprio + conteúdo distribuído</text>
<path d="M120 270h740" stroke="#293b49" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="490" y="293" text-anchor="middle" font-size="17">661 · apoio simples ideal nas duas laterais</text>
<text x="900" y="185" font-size="15">Alternativa:</text><text x="900" y="207" font-size="15">carga no meio</text><text x="900" y="229" font-size="15">do vão</text>
<path d="M954 248v42" stroke="#293b49" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="343" font-size="18" font-weight="bold">Planta · posição nominal das ligações existentes</text>
<rect x="120" y="385" width="740" height="200" fill="#f3f6f6" stroke="#293b49" stroke-width="2"/>
<path d="M120 385h740" stroke="#a96d3c" stroke-width="5" stroke-dasharray="9 6"/>
<text x="490" y="373" text-anchor="middle" font-size="15" fill="#8a562d">Fundo: contato nominal; ligação resistente não creditada</text>
<text x="490" y="613" text-anchor="middle" font-size="15">FRENTE · y = 0</text>
<g fill="#507c8b" stroke="#293b49"><circle cx="158" cy="547" r="7"/><circle cx="822" cy="547" r="7"/><circle cx="158" cy="424" r="7"/><circle cx="822" cy="424" r="7"/></g>
<path d="M900 385v200" stroke="#293b49" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="915" y="490" font-size="16">312</text>
<text x="52" y="552" font-size="14">y = 60</text><text x="42" y="429" font-size="14">y = 252</text>
<text x="490" y="469" text-anchor="middle" font-size="16">4 Minifix nominais · 2 em cada lateral</text>
<text x="490" y="495" text-anchor="middle" font-size="14">Posições são marcadores; furação e resistência ainda precisam de validação.</text>
<text x="50" y="653" font-size="14">O modelo de viga não verifica flexão local da chapa, torção, furos, flexibilidade das ligações ou suspensão do armário.</text>
</g></svg>
