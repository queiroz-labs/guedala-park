<text x="870" y="714" font-size="19" font-weight="normal" text-anchor="start" style="fill:#233e38">Duas réguas de acabamento por grelha</text>
<text x="870" y="748" font-size="19" font-weight="normal" text-anchor="start" style="fill:#233e38">Fixação nas bordas; não recebe peso do forno</text>
<text x="870" y="782" font-size="19" font-weight="normal" text-anchor="start" style="fill:#233e38">Parafusos acessíveis pela frente</text>
<text x="870" y="816" font-size="19" font-weight="normal" text-anchor="start" style="fill:#233e38">Sem colar a grelha nem fechar os rasgos</text>
<text x="648" y="871" font-size="16" font-weight="normal" text-anchor="start" style="fill:#617367">A união das réguas e a retenção da rosca dependem do material final.</text>
<text x="48" y="935" font-size="22" font-weight="bold" text-anchor="start" style="fill:#233e38">Manutenção: retirada frontal de 600 mm testada com os envelopes do estudo.</text>
<text x="48" y="974" font-size="20" font-weight="normal" text-anchor="start" style="fill:#233e38">195 pares sem sobreposição · passagem de ar atravessa os rasgos reais · R30 e R01 preservadas</text>
<text x="48" y="1013" font-size="18" font-weight="normal" text-anchor="start" style="fill:#233e38">Acesso às conexões: desenvolver pelo gabinete da pia à esquerda, após compatibilizar hidráulica e área seca. Gás GN já confirmado.</text>
<text x="48" y="1050" font-size="17" font-weight="normal" text-anchor="start" style="fill:#233e38">Pendentes: apoio e furos reais dos aparelhos, material/ligações do móvel, elétrica e medidas da unidade. Nenhum contato ou compra realizado.</text>
<text x="48" y="1086" font-size="17" font-weight="normal" text-anchor="start" style="fill:#617367">Gabarito 1:1 separado para cotação · Sem confirmação de circulação de pessoas, comprimentos de cabos ou resistência/temperatura.</text>
</svg>