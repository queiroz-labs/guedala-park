<text x="650" y="428" font-size="20" font-weight="normal" text-anchor="start" style="fill:#233e38">12 rasgos de 134 ×17, com cantos R3</text>
<text x="650" y="462" font-size="20" font-weight="normal" text-anchor="start" style="fill:#233e38">Quatro furos Ø4,5 para fixação removível M4</text>
<text x="650" y="496" font-size="20" font-weight="normal" text-anchor="start" style="fill:#233e38">Área aberta por peça:</text>
<text x="1025" y="496" font-size="27" font-weight="bold" text-anchor="start" style="fill:#233e38">272,43 cm²</text>
<text x="650" y="535" font-size="21" font-weight="normal" text-anchor="start" style="fill:#287c8c">8,1% acima dos 252 cm² adotados no projeto</text>
<text x="650" y="570" font-size="16" font-weight="normal" text-anchor="start" style="fill:#617367">Área geométrica, sem tela. Vazão e temperatura ainda precisam de verificação.</text>
<text x="648" y="651" font-size="21" font-weight="bold" text-anchor="start" style="fill:#233e38">SUPORTES FORA DA PASSAGEM DE AR</text>
<rect x="688" y="693" width="32" height="154" fill="#334c43" stroke="#233e38"/>
<rect x="720" y="693" width="120" height="32" fill="#c0a078" stroke="#233e38"/>
