<text x="50" y="990" font-size="20" style="fill:#203c38" text-anchor="start" font-weight="normal">* Com d = 131 mm, restam 219 mm entre envelopes; com 10 mm de tolerância de estudo, restam 209 mm.</text>
<text x="50" y="1026" font-size="18" style="fill:#203c38" text-anchor="start" font-weight="normal">Os 131 mm são a altura total publicada aplicada inteira para baixo. Não representam a projeção instalada nem as conexões.</text>
<text x="50" y="1062" font-size="18" style="fill:#203c38" text-anchor="start" font-weight="normal">Confirmar montagem do forno, corpo/grampos/gás do cooktop, elétrica, grelhas, isolamento e medidas reais antes do corte.</text>
<text x="50" y="1096" font-size="18" style="fill:#65766c" text-anchor="start" font-weight="normal">Estudo separado da R30 · Sem liberação de fabricação · Janela e comandos do forno apenas ilustrativos</text>
