<title id="title">P11: reforço dimensionado para estudo de 20kg</title>
<desc id="desc">Três tubos35por15parede2 sobMDF18; centros30,156,282. Seis bolsosinternos43por18profundidade 6 e calçosanti-giro. Dimensionamento condicionado à prova da ligação no MDF.</desc>
