<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="750" viewBox="0 0 1150 750"><rect width="1150" height="750" fill="#faf8f2"/><g font-family="Arial" fill="#233c35"><text x="35" y="42" font-size="25">MOVENTO 400 — hipótese de rearranjo sem perder o útil da R44</text><text x="35" y="74" font-size="16">Corte esquemático; cotas Z globais em mm. Não é desenho executivo de furação.</text></g><g stroke="#233c35" stroke-width="2"><rect x="65" y="120" width="455" height="36" fill="#c1b292"/><rect x="65" y="580" width="455" height="36" fill="#c1b292"/><rect x="80" y="170" width="400" height="160" fill="none"/><rect x="80" y="276" width="400" height="30" fill="#dcd1bb"/><rect x="80" y="382" width="400" height="160" fill="none"/><rect x="80" y="488" width="400" height="30" fill="#dcd1bb"/><rect x="100" y="168" width="350" height="108" fill="#c6e3ce" opacity="0.7"/><rect x="100" y="367.2" width="350" height="120.8" fill="#c6e3ce" opacity="0.7"/><line x1="80" y1="363.2" x2="480" y2="363.2" stroke="#e28b3f" stroke-width="7"/><line x1="80" y1="575.2" x2="480" y2="575.2" stroke="#e28b3f" stroke-width="7"/></g><g font-family="Arial" fill="#233c35" font-size="18"><text x="560" y="145">Tampo: face inferior Z702 (mantida)</text><text x="560" y="182">Lateral superior: topo Z695 → 7 de folga</text><text x="560" y="225">Conteúdo superior: Z642–696 (altura54)</text><text x="560" y="268">Caixa superior: deslocamento−6</text><text x="560" y="316">Guia superior: mínimoZ598,4</text><text x="560" y="352">Conteúdo inferior: topoZ596,4 → 2 de folga</text><text x="560" y="410">Conteúdo inferior: Z536–596,4 (altura60,4)</text><text x="560" y="454">Caixa inferior: deslocamento−8</text><text x="560" y="502">Eixo fixação inferior: Z530,5</text><text x="560" y="542">Base: face superiorZ490 → eixo a40,5</text><text x="560" y="582">Base desce8; frentes permanecem481–599 /601–719</text><text x="35" y="660" font-size="17">A imagem destaca as relações verticais; espessuras e comprimentos desenhados apenas para leitura.</text><text x="35" y="690" font-size="17">Perfil real, engates, regulagem e retirada precisam fechar sem os pequenos conflitos já encontrados na R44.</text></g></svg>

