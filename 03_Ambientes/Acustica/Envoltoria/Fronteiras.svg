<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Diagrama de recintos, fronteiras a confirmar"><rect width="900" height="430" fill="#fff"/><g font-family="sans-serif" fill="#222"><text x="24" y="30" font-size="20">Envoltória: mapa de pendências — sem escala</text><text x="24" y="57" font-size="14">Cinza: déficit/folga desconhecidos. Roxo: prioridade de investigação, não resultado acústico.</text>
<rect x="24" y="80" width="270" height="125" rx="8" fill="#f2f3f4" stroke="#7446aa" stroke-width="4"/><text x="36" y="108" font-size="16">Quarto — prioridade</text><text x="36" y="136" font-size="13">Paredes: outro lado a confirmar</text><text x="36" y="159" font-size="13">Teto: composição superior pendente</text><text x="36" y="182" font-size="13">Rw / DnT,w / L’nT,w indeterminados</text>
