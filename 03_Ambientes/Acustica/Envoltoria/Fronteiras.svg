<text x="24" y="385" font-size="14">Não representa posição, contiguidade ou dimensão dos cômodos.</text><text x="24" y="408" font-size="14">Janelas da planta identificam exterior na abertura; vizinhos e shafts exigem planta legível.</text></g></svg>