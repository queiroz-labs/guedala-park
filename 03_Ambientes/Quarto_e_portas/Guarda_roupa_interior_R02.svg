<text x="115" y="974.64" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#34372f">Larguras úteis inferiores; divisórias de 1,8 cm.</text>
<rect x="795" y="155" width="650" height="167" fill="#e8ebdf" stroke="#e8ebdf"/>
<text x="823" y="203.68" font-family="Arial" font-size="29" font-weight="700" text-anchor="start" fill="#34372f">2,61 m de varões nominais</text>
<text x="823" y="241.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">Antes: 1,864 m  →  ganho de aproximadamente 40%</text>
<text x="823" y="282.32" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" fill="#34372f">Mesmo envelope, mesma circulação prevista.</text>
<text x="815" y="369.48" font-family="Arial" font-size="19" font-weight="700" text-anchor="start" fill="#34372f">O QUE CADA PESSOA GANHA</text>
<text x="815" y="411.32" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" fill="#34372f">• Um varão superior de ponta a ponta.</text>
<text x="815" y="446.32" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" fill="#34372f">• Um varão inferior para roupas curtas.</text>
<text x="815" y="481.32" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" fill="#34372f">• Reserva para um casaco longo.</text>
<text x="815" y="516.32" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" fill="#34372f">• Duas gavetas e cinco pares de tênis.</text>
<text x="815" y="551.32" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" fill="#34372f">• Metade do maleiro para dobrados e uso eventual.</text>
<text x="815" y="607.48" font-family="Arial" font-size="19" font-weight="700" text-anchor="start" fill="#34372f">SAPATEIRA: 2 + 2 + 1 PARES</text>
<text x="815" y="647.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">Dois níveis com um tênis acima do outro,</text>
<text x="815" y="677.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">em suportes separados; último nível com par simples.</text>
<text x="815" y="707.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">Prateleiras fixas reguláveis: sem bandeja extraível.</text>
<text x="815" y="737.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">*Capacidade depende dos tênis e dos organizadores.</text>
<text x="815" y="792.48" font-family="Arial" font-size="19" font-weight="700" text-anchor="start" fill="#34372f">TROCAS DO NOVO PLANO</text>
<text x="815" y="832.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">Gavetas com frentes de 15 cm, para íntimas e meias.</text>
<text x="815" y="863.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">Prateleiras superiores dão lugar aos cabideiros.</text>
<text x="815" y="894.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">Varão a 205 cm: testar alcance dos dois usuários.</text>
<text x="815" y="925.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">Conferir abertura das gavetas e portas de correr.</text>
<line x1="55" y1="1015" x2="1445" y2="1015" stroke="#c7c4b9" stroke-width="1"/>
<text x="55" y="1060.24" font-family="Arial" font-size="22" font-weight="700" text-anchor="start" fill="#34372f">Circulação preservada: 55–57 cm diante do armário; 45–47 cm nos pés da cama.</text>
<text x="55" y="1098.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">Altura 240 cm e afastamento de 20 cm na janela são hipóteses de estudo. Medir cama e teto acabados.</text>
<text x="55" y="1131.4" font-family="Arial" font-size="20" font-weight="400" text-anchor="start" fill="#34372f">Vista sem portas. Cores ilustrativas. Não é lista de corte; o ganho depende da validação da sapateira.</text>
<text x="55" y="1160.72" font-family="Arial" font-size="16" font-weight="400" text-anchor="start" fill="#34372f">F134 · 13/09/2026</text>
</svg>