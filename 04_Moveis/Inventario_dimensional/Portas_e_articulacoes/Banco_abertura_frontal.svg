<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#fafafa"/><style>text{font:16px Arial;fill:#182e31}.small{font-size:13px}.title{font-size:25px;font-weight:bold}</style><text x="30" y="40" class="title">Banco — alternativa de abertura para a frente</text><text x="30" y="66">Somente trajetória geométrica. Não é ferragem Rockler validada nem alteração adotada.</text><g transform="translate(70,540) scale(.8,-.5)"><rect x="0" y="400" width="100" height="500" fill="#b4b9ae"/><rect x="100" y="0" width="18" height="400" fill="#d6bc91"/><rect x="530" y="0" width="18" height="400" fill="#d6bc91"/><rect x="140" y="292" width="372" height="18" fill="#d6bc91"/><rect x="160" y="110" width="350" height="164" fill="#92b3a5"/><rect x="102" y="400" width="448" height="20" fill="#4b8592"/><polygon points="162.02,624.00 550.00,400.00 560.00,417.32 172.02,641.32" fill="#d9814c" fill-opacity=".25" stroke="#bc5928" stroke-width="3"/><polygon points="326.00,787.98 550.00,400.00 567.32,410.00 343.32,797.98" fill="#d9814c" fill-opacity=".25" stroke="#bc5928" stroke-width="3"/><polygon points="550.00,848.00 550.00,400.00 570.00,400.00 570.00,848.00" fill="#d9814c" fill-opacity=".25" stroke="#bc5928" stroke-width="3"/><line x1="475" y1="790" x2="1000" y2="790" stroke="#ac2525" stroke-width="8"/><circle cx="550" cy="400" r="7" fill="#a53028"/></g><text x="600" y="160">A partir de 76,3°: tampa cruza a Berlin</text><text x="600" y="190">X550–570; Z400–848 mm</text><text x="600" y="220">Pico durante giro: Z848,45 mm</text><text x="600" y="270">Prateleira e conteúdo não são atingidos</text><text x="600" y="300">mas há colisão com o tampo da mesa.</text><text x="600" y="355">Acesso exige alcançar por cima</text><text x="600" y="385">ou pelas laterais da tampa erguida.</text><text x="600" y="435">Eixo e suportes reais ainda não definidos.</text><text x="30" y="590" class="small">Corte ilustrativo do compartimento 2; escalas X e Z diferentes. Almofadas retiradas. Não é desenho de fabricação.</text></svg>